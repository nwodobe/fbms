<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<script>
/* Doublures : identité, serveur des repères et champs préparés. AUCUNE donnée réelle.
   Les points fictifs sont placés dans la zone pilote PUBLIQUE de Bouaké ; ils ne
   correspondent à aucune parcelle de producteur. Le gestionnaire de cartes, Leaflet,
   IndexedDB et le décodage des images sont ceux du navigateur, sans doublure. */
(function () {
  var q = new URLSearchParams(location.search);
  window.ANAGROCI_SUPABASE_URL = 'https://banc.invalid'; window.ANAGROCI_SUPABASE_ANON = 'banc';
  if (q.get('reseau') === 'non') Object.defineProperty(navigator, 'onLine', { get: function () { return false; } });
  /* Espace insuffisant simulé : seule l'estimation est remplacée, pas le code qui la juge. */
  if (q.get('espace') === 'faible') navigator.storage.estimate = function () { return Promise.resolve({ quota: 80 * 1024 * 1024, usage: 70 * 1024 * 1024 }); };
  var compte = q.get('compte') || 'u-uh';
  window.ANAGROCI_AUTH = compte === 'aucun' ? { profile: null, user: null } : { profile: { user_id: compte, role: 'Unit Head', cluster: 'BROBO', actif: true }, user: { id: compte } };
  function etat() { try { return JSON.parse(localStorage.getItem('banc_srv') || '{}'); } catch (e) { return {}; } }
  function ecrire(s) { localStorage.setItem('banc_srv', JSON.stringify(s)); }
  window.BANC = { serveur: etat };
  function lot(ops) {
    var s = etat(); s.appels = (s.appels || 0) + 1; s.recus = s.recus || {}; s.actifs = s.actifs || {}; s.lignes = s.lignes || [];
    var res = ops.map(function (o) {
      if (s.recus[o.idempotency_key]) return Object.assign({}, s.recus[o.idempotency_key], { rejoue: true });
      var p = o.payload, cle = p.objet_type + ':' + p.objet_id, cur = s.actifs[cle];
      var v = { version_no: (cur ? cur.version_no : 0) + 1, latitude: p.latitude, longitude: p.longitude, origine: p.origine, created_at: new Date().toISOString() };
      s.actifs[cle] = v; s.lignes.push({ cle: cle, compte: window.ANAGROCI_AUTH.profile.user_id, version_no: v.version_no });
      var r = { idempotency_key: o.idempotency_key, statut: 'ACCEPTEE', version_no: v.version_no, inchange: false, recu_serveur_le: v.created_at };
      s.recus[o.idempotency_key] = r; return r;
    });
    ecrire(s); return { resultats: res };
  }
  function requete() { var r = { select: f, eq: f, in: f, order: f, range: f, limit: f, then: function (ok) { return Promise.resolve({ data: [], error: null }).then(ok); } }; function f() { return r; } return r; }
  window.supabase = { createClient: function () { return {
    rpc: function (nom, args) { return q.get('reseau') === 'non' ? Promise.reject(new TypeError('Failed to fetch')) : Promise.resolve({ data: lot(args.p_operations), error: null }); },
    from: function () { return requete(); } }; } };
  var P1 = '11111111-1111-4111-8111-111111111111', P2 = '22222222-2222-4222-8222-222222222222';
  var B1 = 'bbbbbbbb-bbbb-4bbb-8bbb-000000000001';
  var parcelles = [
    { plot_id: P1, plot_code: 'PCL-BANC-01', producteur_id: 'PR1', producteur_code: 'F-BANC-1', producteur_nom: 'TESTEUR', producteur_prenoms: 'Un', village_nom: 'Village Banc', cluster_code: 'BROBO', zone_code: 'Z1', local_name: 'Champ du banc A', latitude: 7.6805, longitude: -5.0502, gps_accuracy_m: 8, gps_captured_at: '2026-11-20T09:00:00Z', gps_status: 'POINT_CAPTURED', current_geometry_id: null, consentement_gps: true },
    { plot_id: P2, plot_code: 'PCL-BANC-02', producteur_id: 'PR2', producteur_code: 'F-BANC-2', producteur_nom: 'TESTEUR', producteur_prenoms: 'Deux', village_nom: 'Village Banc', cluster_code: 'BROBO', zone_code: 'Z1', local_name: 'Champ sans position B', latitude: null, longitude: null, gps_status: 'NOT_MAPPED', consentement_gps: true }];
  var arbres = []; for (var i = 1; i <= 6; i++) arbres.push({ id: 'aaaaaaaa-aaaa-4aaa-8aaa-0000000000' + ('0' + i).slice(-2), panel_id: 'pan-1', bloc_id: B1, bloc_numero: 1, code: 'B01/A0' + i, code_suivi: 'A00' + i, role: 'TITULAIRE', rang: i, statut: 'ACTIF',
    latitude: i <= 2 ? 7.6805 + i * 0.0004 : null, longitude: i <= 2 ? -5.0502 + i * 0.0005 : null, gps_precision_m: i <= 2 ? 9 : null });
  window.ANAGROCI_PARCELLES_LOCAL = { cache: { lire: function (cle) { return Promise.resolve(cle === 'parcelles' ? parcelles : null); } } };
  window.ANAGROCI_OBS_LOCAL = {
    panels: function () { return Promise.resolve([{ id: 'pan-1', plot_id: P1, cluster_code: 'BROBO', local: false, blocs: [{ id: B1, numero: 1, repere: 'entrée nord' }], arbres: arbres }]); },
    referentiel: function () { return Promise.resolve({ plots: [], villages: [], producteurs: [] }); } };
})();
</script>

</head><body data-workspace="field"><main class="ops-main"><div id="opsRouteView" class="ops-route-view"></div></main>
<script>
function router() {
  var h = location.hash || '';
  if (/^#parcelles\/cartes-hors-ligne/.test(h)) window.ANAGROCI_CARTES_HORS_LIGNE.render(document.getElementById('opsRouteView'), { retour: '#reperes' });
  else if (/^#reperes/.test(h)) window.ANAGROCI_REPERES.render(h.slice(1).split('/'));
  else location.hash = 'parcelles/cartes-hors-ligne';
}
window.addEventListener('hashchange', router); router();
</script></body></html>
