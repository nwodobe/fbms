name: Operations Suite PR

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'operations/**'
      - 'supabase/**'
      - 'tests/operations-suite-static.mjs'
      - 'tests/field-buying-profiles-static.mjs'
      - 'tests/field-buying-prefilled-edit-static.mjs'
      - 'tests/field-buying-performance-static.mjs'
      - 'tests/sacherie-operational-p1-static.mjs'
      - 'tests/sacherie-aflp-colonnes-droits-static.mjs'
      - 'tests/rt-farmer-edit-rights-static.mjs'
      - '.github/workflows/operations-suite-pr.yml'

permissions:
  contents: read

jobs:
  operations-static:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assertions architecture métier
        run: node tests/operations-suite-static.mjs
      - name: Assertions fiches 360 et médias FIELD BUYING
        run: node tests/field-buying-profiles-static.mjs
      - name: Assertions édition préremplie FIELD BUYING
        run: node tests/field-buying-prefilled-edit-static.mjs
      - name: Assertions performance FIELD BUYING
        run: node tests/field-buying-performance-static.mjs
      - name: Assertions Sacherie opérationnelle P1
        run: node tests/sacherie-operational-p1-static.mjs
      - name: Assertions Sacherie AFLP — colonnes, droits et tolérance
        run: node tests/sacherie-aflp-colonnes-droits-static.mjs
      - name: Assertions droits RT/Producteurs — édition sans suppression
        run: node tests/rt-farmer-edit-rights-static.mjs
      - name: Syntaxe JavaScript Operations
        run: |
          node --check operations/workspace.js
          node --check operations/navigation-v2.js
          node --check operations/field-buying-performance-bootstrap.js
          node --check operations/field-buying.js
          node --check operations/rt-farmer-rights.js
          node --check operations/sacherie-operational-p1.js
          node --check operations/field-buying-profiles.js
          node --check operations/field-buying-prefilled-edit.js
          node --check operations/field-buying-v2.js
          node --check operations/lba-purchase-v2.js
          node --check operations/module-router-v2.js
          node --check operations/reports-export.js
          node --check operations/traceability-search.js
