# Source unique de vérité pour l'identité de l'application Android.
# applicationId ne doit JAMAIS changer : Android considérerait une autre application
# et les données locales (opérations non synchronisées) ne seraient pas reprises.
applicationId=ci.anagroci.fieldbuying
# versionCode : entier, à incrémenter à CHAQUE nouvel APK distribué (1, 2, 3…).
versionCode=3
versionName=1.2.0
# Plus petit versionCode capable de recevoir les mises à jour Web signées (format 2, magasin immuable : introduit en 1.2.0).
# Une mise à jour signée déclare ce minimum ; un APK plus ancien la refuse et garde sa version.
webUpdateMinVersionCode=3
minSdk=24
targetSdk=34
compileSdk=34
