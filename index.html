<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#053B23">
<title>ANAGROCI Operations Suite</title>
<link rel="icon" href="assets/logo-pjs-mark.png">
<script defer src="./shared/auth-gate.js?v=82bca416" data-module="portail"></script>
<script id="anagroci-i18n-js" defer src="./shared/i18n.js?v=ede4aed"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
/* ── Tokens PJS Global (charte "Known for Quality") ───────────────── */
:root{
  --green-forest:#053B23; --green-deep:#0A5531; --green-pine:#00712C;
  --green-emerald:#008F37; --green-grass:#2DA64F; --green-lime:#8DC556;
  --green-sprout:#B6DC8E; --green-pale:#E0F3DE;
  --orange-pjs:#EE9E00; --orange-tint:#FDEFCE;
  --ink:#323131; --white:#fff;
  --font-display:'Archivo',system-ui,sans-serif;
  --font-body:'IBM Plex Sans',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',monospace;
  --radius-md:12px; --radius-pill:999px;
  --ease-out:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font-body);color:var(--white);-webkit-font-smoothing:antialiased;
  background:radial-gradient(1100px 640px at 82% -14%,var(--green-pine) 0%,rgba(0,113,44,0) 60%),var(--green-forest);min-height:100vh}
a{color:var(--green-sprout);text-decoration:none}
a:hover{color:var(--white)}
.pad{padding-left:34px;padding-right:34px}

header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:20px;flex-wrap:wrap;
  padding:14px 34px;background:rgba(4,42,25,.8);backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.12)}
.brand{display:flex;align-items:center;gap:11px}
.brand img{height:34px;display:block}
.brand-sep{width:1px;height:28px;background:rgba(255,255,255,.22)}
.wordmark{font-family:var(--font-display);font-weight:700;font-size:19px;white-space:nowrap}
.wordmark span{color:var(--green-lime);font-weight:600}
.eyebrow{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--green-sprout);font-weight:600;white-space:nowrap}
.hdr-title{font-family:var(--font-display);font-weight:600;font-size:16px;margin-top:2px}
.status{display:flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:11.5px;color:var(--green-sprout);
  background:rgba(141,197,86,.14);border:1px solid rgba(141,197,86,.32);border-radius:var(--radius-pill);padding:6px 12px;white-space:nowrap}
.status i{width:7px;height:7px;border-radius:var(--radius-pill);background:var(--green-lime);display:block}
.mono{font-family:var(--font-mono);font-size:12.5px;color:#CFE3D3;white-space:nowrap}

.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:16px;padding:24px 0 6px}
.search{display:flex;align-items:center;gap:11px;background:var(--white);border-radius:var(--radius-md);
  padding:11px 15px;flex:1;min-width:280px;max-width:520px;color:var(--green-forest)}
.search input{flex:1;border:0;outline:0;font-family:var(--font-body);font-size:14.5px;color:var(--ink);background:transparent;min-width:0}
.chips{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{font-size:13px;font-weight:600;line-height:1;padding:7px 13px;border-radius:var(--radius-pill);cursor:pointer;
  white-space:nowrap;color:var(--white);background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.28);
  transition:background 140ms var(--ease-out)}
.chip:hover{background:rgba(141,197,86,.24)}
.chip[aria-pressed="true"]{background:var(--green-lime);border-color:var(--green-lime);color:var(--green-forest)}
.count{font-family:var(--font-mono);font-size:11.5px;color:#CFE3D3;white-space:nowrap}

section.family{margin-top:30px}
.fam-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;
  border-left:4px solid var(--green-lime);padding-left:14px;margin-bottom:16px}
.fam-head h2{font-family:var(--font-display);font-weight:600;font-size:22px;margin:0;letter-spacing:-.01em}
.fam-head p{margin:4px 0 0;font-size:13.5px;color:var(--green-sprout)}
.badge{display:inline-flex;align-items:center;font-size:12px;font-weight:600;line-height:1;padding:5px 10px;
  border-radius:var(--radius-pill);background:var(--green-pale);color:var(--green-forest);white-space:nowrap}
.badge.warning{background:var(--orange-tint);color:#9A6700}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:14px}
.tile{position:relative;display:block;height:186px;border-radius:var(--radius-md);overflow:hidden;
  border:1px solid rgba(255,255,255,.18);box-shadow:0 12px 28px -16px rgba(5,59,35,.8),inset 0 1px 0 rgba(255,255,255,.16);
  transition:transform 240ms var(--ease-out),box-shadow 240ms var(--ease-out)}
.tile:hover{transform:translateY(-5px);box-shadow:0 30px 54px -20px rgba(5,59,35,.95)}
.tile[data-locked="true"]{opacity:.5;pointer-events:none}
.tile img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile .wash,.tile .wash2,.tile .scrim{position:absolute;inset:0;pointer-events:none}
.tile .wash{opacity:.82;mix-blend-mode:multiply}
.tile .wash2{opacity:.32}
.tile .scrim{background:linear-gradient(to top,rgba(5,59,35,.86) 0%,rgba(5,59,35,.14) 58%,rgba(5,59,35,0) 100%)}
.tile .stripe{position:absolute;top:0;left:0;right:0;height:3px;background:var(--orange-pjs)}
.tile .code{position:absolute;top:13px;right:13px;z-index:2}
.tile .body{position:absolute;inset:0;padding:16px 18px;display:flex;flex-direction:column;justify-content:flex-end;color:var(--white)}
.tile .body svg{width:26px;height:26px;stroke-width:1.75;margin-bottom:10px;filter:drop-shadow(0 2px 6px rgba(5,59,35,.7))}
.tile h3{font-family:var(--font-display);font-weight:700;font-size:18px;line-height:1.2;letter-spacing:-.01em;margin:0;
  text-shadow:0 1px 10px rgba(5,59,35,.65)}
.tile p{margin:4px 0 0;font-size:12.5px;line-height:1.45;color:rgba(255,255,255,.88);text-shadow:0 1px 8px rgba(5,59,35,.55)}
.tile .roles{margin-top:10px;padding-top:9px;border-top:1px solid rgba(255,255,255,.26);font-family:var(--font-mono);
  font-size:10px;letter-spacing:.08em;color:rgba(255,255,255,.82);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.empty{background:rgba(255,255,255,.06);border:1px dashed rgba(255,255,255,.3);border-radius:var(--radius-md);
  padding:56px 30px;text-align:center;margin-top:32px}
.empty strong{font-family:var(--font-display);font-size:18px}
.empty p{margin:8px auto 0;font-size:13.5px;color:var(--green-sprout);max-width:440px;line-height:1.6}

footer{margin-top:56px;padding-top:20px;border-top:1px solid rgba(255,255,255,.16);display:flex;flex-wrap:wrap;
  gap:16px;justify-content:space-between;font-size:12px;color:var(--green-sprout)}
/* Emplacements des correctifs partagés (auth-gate / i18n) dans l'en-tête sombre */
#anagroci-lang-slot{display:inline-flex;align-items:center}
@media(max-width:900px){.pad,header{padding-left:20px;padding-right:20px}}
</style>
</head>
<body>

<header>
  <div class="brand">
    <img src="assets/logo-pjs-mark.png" alt="PJS Global">
    <div class="brand-sep"></div>
    <div class="wordmark">ANAGROCI<span> Operations</span></div>
  </div>
  <div style="flex:1;min-width:150px">
    <div class="eyebrow">Plateforme achats</div>
    <div class="hdr-title">Toutes les applications</div>
  </div>
  <div class="status"><i></i>Plateforme en ligne</div>
  <div class="mono" id="campaign">Campagne RCN 2026</div>
  <span id="anagroci-lang-slot"></span>
  <span id="anagroci-userslot"></span>
</header>

<div class="pad" style="padding-bottom:64px">
  <div class="toolbar">
    <label class="search">
      <span data-lucide="search" style="opacity:.65;display:flex"></span>
      <input id="q" type="search" placeholder="Rechercher une application…">
    </label>
    <div class="chips" id="chips">
      <span class="eyebrow" style="margin-right:2px">Mon rôle</span>
    </div>
    <div class="count" id="count"></div>
  </div>
  <div id="out"></div>
</div>

<footer class="pad">
  <div>© ANAGROCI — Operations Suite · Campagne RCN 2026 · Known for Quality</div>
  <div>Une donnée, une identité, une plateforme.</div>
</footer>

<script>
/* ── Tonalités : dégradés dérivés des tokens PJS ─────────────────── */
const G = (a,b) => `linear-gradient(155deg,${a} 0%,${b} 100%)`;
const TONES = {
  emerald:{ink:'var(--green-emerald)',grad:G('var(--green-pine)','var(--green-grass)')},
  pine:{ink:'var(--green-pine)',grad:G('var(--green-deep)','var(--green-emerald)')},
  deep:{ink:'var(--green-deep)',grad:G('var(--green-forest)','var(--green-pine)')},
  lime:{ink:'var(--green-grass)',grad:G('var(--green-grass)','var(--green-lime)')},
  signal:{ink:'#9A6700',grad:G('#8A5C00','var(--orange-pjs)')}   /* orange = signal, 1 seule tuile */
};

/* ── Registre des applications : routes réelles du portail ──────────
   photo : remplacer par vos images terrain (assets/img/…).           */
const FAMILIES = [
 {id:'terrain',label:'Opérations terrain',desc:'Saisie quotidienne pendant la campagne',items:[
  {code:'ACH',title:'Achats Terrain',desc:'Saisie journalière RCN · Producteur → RT',roles:'AGENT · SUP · BM',href:'terrain/achats.html',icon:'shopping-basket',tone:'emerald',
   photo:'https://t3.ftcdn.net/jpg/05/84/65/90/240_F_584659016_v322JWc02NV2z1Vm3h0M6i95syr7uy9j.jpg'},
  {code:'SAC',title:'Stock & Sacs',desc:'Traçabilité des sacs et mouvements',roles:'AGENT · SUP · BM',href:'terrain/sacs.html',icon:'package',tone:'lime',
   photo:'https://t3.ftcdn.net/jpg/01/52/01/48/240_F_152014816_s7VoF6psfgkoqrIXSx4B4cViZvuPeiPN.jpg'},
  {code:'RCN',title:'RCN TRACE',desc:'Traçabilité & bilan matière',roles:'AGENT · SUP · BM · PILOTE',href:'rcntrace/index.html',icon:'scan-line',tone:'pine',
   photo:'https://t3.ftcdn.net/jpg/03/17/46/54/240_F_317465499_KNf3l2VLI5Be3kxeZCzaJJRVkH7fHnpR.jpg'}]},
 {id:'pilotage',label:'Pilotage & contrôle',desc:'Vue Branch Manager',items:[
  {code:'CMD',title:'Command Center',desc:'Anomalies, file offline, RT à risque',roles:'BM',href:'terrain/command.html',icon:'radar',tone:'signal',stripe:true,
   photo:'https://t4.ftcdn.net/jpg/03/56/35/53/240_F_356355346_Ifv1AgI1FMhDJ9a8PNYSrGLLjG99tzt1.jpg'},
  {code:'CFA',title:'Caisse & Avances',desc:'Contrôle de caisse RT et avances',roles:'SUP · BM',href:'terrain/cash.html',icon:'wallet',tone:'emerald',
   photo:'https://t3.ftcdn.net/jpg/03/78/85/18/240_F_378851836_h6GNnGhPweKpYsSeh9lflBPQSQjNbmt9.jpg'},
  {code:'AUD',title:'Audit Distances',desc:'Validation des distances routières',roles:'SUP · BM',href:'fbms/audit_distances.html',icon:'ruler',tone:'deep',
   photo:'https://t4.ftcdn.net/jpg/03/84/97/77/240_F_384977742_7wjOWbk9uc5esarTYE1vXq49nBKnOTnL.jpg'}]},
 {id:'referentiel',label:'Référentiel & logistique',desc:'Données de fond et outils d’analyse',items:[
  {code:'REF',title:'FBMS Référentiel',desc:'Zones, villages, RT, producteurs',roles:'AGENT · SUP · BM',href:'fbms/index.html',icon:'database',tone:'pine',
   photo:'https://t4.ftcdn.net/jpg/04/38/60/01/240_F_438600120_TKBM8CodH8ZNUc4i8LVNtqx2h7H2iu02.jpg'},
  {code:'HUB',title:'Hubs / Clusters',desc:'GPS hubs & distances usine',roles:'SUP · BM',href:'fbms/fbms_hubs.html',icon:'network',tone:'deep',
   photo:'https://t4.ftcdn.net/jpg/04/78/79/87/240_F_478798767_k4gDVVlHTutJFNaYK0AV5f6VYhqIJuOl.jpg'},
  {code:'MAP',title:'Cartographie',desc:'Carte interactive du terrain',roles:'AGENT · SUP · BM',href:'fbms/fbms_carte.html',icon:'map-pin',tone:'lime',
   photo:'https://t4.ftcdn.net/jpg/10/79/75/49/240_F_1079754985_JrhQAlaqSeALItv5pctqoCnc0DdypzGG.jpg'},
  {code:'LOG',title:'ALIS Logistique',desc:'Coût rendu usine et simulation',roles:'SUP · BM',href:'logistique/alis_fbms.html',icon:'truck',tone:'emerald',
   photo:'https://t4.ftcdn.net/jpg/02/61/08/11/240_F_261081168_Wi6TF6qz5Tzq1A4VO8SqZLoM55Jtx6GJ.jpg'}]}
];

const ROLES = ['Tous les rôles','Branch Manager','Supervisor','Agent'];
const ROLE_TAG = {'Branch Manager':'BM','Supervisor':'SUP','Agent':'AGENT'};
/* Correspondance avec les niveaux exposés par auth-gate. */
const NIVEAU_ROLE = {bm:'Branch Manager',chef:'Supervisor',agent:'Agent',direction:'Tous les rôles'};
let role = 'Tous les rôles', query = '';
const norm = s => (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');

const chips = document.getElementById('chips');
ROLES.forEach(r => {
  const b = document.createElement('button');
  b.className = 'chip'; b.type = 'button'; b.textContent = r;
  b.setAttribute('aria-pressed', String(r === role));
  b.onclick = () => { role = r;
    [...chips.querySelectorAll('.chip')].forEach(c => c.setAttribute('aria-pressed', String(c.textContent === r))); render(); };
  chips.appendChild(b);
});
document.getElementById('q').addEventListener('input', e => { query = e.target.value; render(); });

function render(){
  const tag = ROLE_TAG[role], q = norm(query).trim();
  const out = document.getElementById('out');
  out.innerHTML = ''; let visible = 0, total = 0;

  FAMILIES.forEach(fam => {
    const items = fam.items.filter(m => {
      const locked = tag ? !m.roles.includes(tag) : false;
      if (!locked) total++;
      return !q || norm(`${m.title} ${m.desc} ${m.code}`).includes(q);
    });
    if (!items.length) return;
    visible += items.length;

    const sec = document.createElement('section');
    sec.className = 'family'; sec.id = fam.id;
    sec.innerHTML = `<div class="fam-head"><div><h2>${fam.label}</h2><p>${fam.desc}</p></div>
      <span class="badge">${items.length} application${items.length > 1 ? 's' : ''}</span></div>
      <div class="grid"></div>`;
    const grid = sec.querySelector('.grid');

    items.forEach(m => {
      const locked = tag ? !m.roles.includes(tag) : false;
      const t = TONES[m.tone];
      const ink = locked ? '#3E5645' : t.ink;
      const grad = locked ? G('#33473A','#5C7264') : t.grad;
      const a = document.createElement('a');
      a.className = 'tile'; a.href = m.href; a.dataset.locked = String(locked);
      a.style.background = ink;
      a.innerHTML = `
        <img class="bg" src="${m.photo}" alt="">
        <div class="wash" style="background:${grad}"></div>
        <div class="wash2" style="background:${grad}"></div>
        <div class="scrim"></div>
        ${m.stripe && !locked ? '<div class="stripe"></div>' : ''}
        <span class="code"><span class="badge${m.tone === 'signal' ? ' warning' : ''}" style="font-family:var(--font-mono);letter-spacing:.08em">${m.code}</span></span>
        <div class="body">
          <span data-lucide="${m.icon}"></span>
          <h3>${m.title}</h3>
          <p>${m.desc}</p>
          <div class="roles">${m.roles}</div>
        </div>`;
      grid.appendChild(a);
    });
    out.appendChild(sec);
  });

  if (!visible) out.innerHTML = `<div class="empty"><strong>Aucune application ne correspond à « ${query} »</strong>
    <p>Essayez « sacs », « distances », « caisse » ou changez de rôle pour voir les applications correspondantes.</p></div>`;

  document.getElementById('count').textContent = total + ' applications pour ce rôle';
  if (window.lucide) window.lucide.createIcons();
}

render();

/* ── Rôle pré-sélectionné depuis l'utilisateur connecté (auth-gate) ──
   Le filtre reste visuel : l'accès réel à chaque module est contrôlé par
   auth-gate côté page de destination. */
function setRoleFromNiveau(niv){
  const r = NIVEAU_ROLE[niv]; if(!r) return;
  role = r;
  [...chips.querySelectorAll('.chip')].forEach(c => c.setAttribute('aria-pressed', String(c.textContent === r)));
  render();
}
document.addEventListener('anagroci:authenticated', function(){
  try{ const niv = window.ANAGROCI_AUTH && window.ANAGROCI_AUTH.niveau; if(niv) setRoleFromNiveau(niv); }catch(e){}
});

/* Service worker (barre FR/EN + injection i18n), comme le reste de la suite. */
(function(){
  if(!('serviceWorker' in navigator)) return;
  navigator.serviceWorker.register('./i18n-sw.js?v=nocache1').then(function(reg){ if(reg.update) reg.update(); }).catch(function(){});
})();

window.addEventListener('load', () => window.lucide && window.lucide.createIcons());
</script>
</body>
</html>
