# =============================================================================
# FBMS — auto-fusion conditionnelle  (INSTALLÉE, DÉSACTIVÉE)
# =============================================================================
# Ce workflow est volontairement inerte à l'installation : tant que la variable
# de dépôt `AGENT_AUTO_MERGE_ENABLED` ne vaut pas exactement `true`, il constate
# qu'il est désactivé et s'arrête. Aucune fusion n'est possible.
#
# L'activer est une décision, pas un réglage. Avant de la prendre, il faut au
# minimum :
#   1. plusieurs semaines d'exécutions vertes de `agent-quality-gates.yml` ;
#   2. la certitude que la protection de branche exige bien ces contrôles
#      (sinon l'auto-fusion passerait outre au lieu d'attendre) ;
#   3. avoir relu `.github/agent-policy/auto-merge-allowlist.txt` en se
#      demandant, pour chaque motif : « suis-je d'accord pour que ceci parte en
#      production sans qu'un humain l'ait lu ? »
#
# Quatre conditions cumulatives sont exigées avant toute fusion :
#   · l'interrupteur global est armé ;
#   · la pull request porte le libellé `agent-auto-merge` ;
#   · elle n'est pas un brouillon ;
#   · tous ses fichiers sont dans l'allowlist et aucun dans la denylist,
#     listes lues depuis la branche de base.
#
# La fusion elle-même est déléguée à l'auto-fusion NATIVE de GitHub : elle
# n'aboutit que si les contrôles requis passent et si les révisions exigées par
# la protection de branche sont réunies. Ce workflow ne peut donc pas fusionner
# à la place d'une règle de protection — il ne fait qu'exprimer une intention.
name: Auto-fusion conditionnelle des agents

on:
  pull_request_target:
    types: [labeled, ready_for_review, synchronize]

# ---------------------------------------------------------------------------
# Pourquoi `pull_request_target` et non `pull_request`
# ---------------------------------------------------------------------------
# `pull_request` est le choix habituel, et pour de bonnes raisons : il n'accorde
# qu'un jeton en lecture seule aux pull requests venues d'un fork. Mais il a ici
# un défaut rédhibitoire : c'est la version du workflow PRÉSENTE DANS LA BRANCHE
# PROPOSÉE qui s'exécute. Une pull request pourrait donc réécrire la porte
# chargée de la juger, et se fusionner elle-même.
#
# `pull_request_target` exécute la version de la BASE : la porte n'est pas
# réécrivable par ce qu'elle examine. Son risque propre — un jeton privilégié
# sur un événement non fiable — est neutralisé par deux règles tenues
# strictement :
#
#   1. AUCUN checkout du code de la branche proposée. Jamais. Seules des
#      métadonnées et les listes de la base sont lues.
#   2. Le job `interrupteur` refuse toute pull request qui ne vient pas de ce
#      dépôt même. Une contribution de fork ne peut donc pas atteindre le job
#      qui détient les droits d'écriture.
permissions:
  contents: read

concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  interrupteur:
    name: L'auto-fusion est-elle armée ?
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      armee: ${{ steps.verdict.outputs.armee }}
    steps:
      - id: verdict
        env:
          AI_AGENTS_ENABLED: ${{ vars.AI_AGENTS_ENABLED }}
          AGENT_AUTO_MERGE_ENABLED: ${{ vars.AGENT_AUTO_MERGE_ENABLED }}
          DEPOT_SOURCE: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          # Contrepartie obligatoire de `pull_request_target` : une pull request
          # venue d'un fork n'atteint jamais le job qui détient les droits
          # d'écriture. Sans cette barrière, n'importe qui pourrait soumettre
          # une contribution évaluée avec un jeton privilégié.
          if [ "${DEPOT_SOURCE}" != "${{ github.repository }}" ]; then
            {
              echo "### Auto-fusion refusée : pull request externe"
              echo
              echo "Source : \`${DEPOT_SOURCE}\` — attendu : \`${{ github.repository }}\`."
              echo "Les contributions de fork sont fusionnées à la main, jamais ici."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "armee=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "${AGENT_AUTO_MERGE_ENABLED}" != "true" ] || [ "${AI_AGENTS_ENABLED}" != "true" ]; then
            {
              echo "### Auto-fusion désactivée"
              echo
              echo "\`AI_AGENTS_ENABLED\` = \`${AI_AGENTS_ENABLED:-(absente)}\`"
              echo "\`AGENT_AUTO_MERGE_ENABLED\` = \`${AGENT_AUTO_MERGE_ENABLED:-(absente)}\`"
              echo
              echo "C'est l'état voulu à l'installation. Aucune fusion n'a été demandée."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "armee=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "armee=true" >> "$GITHUB_OUTPUT"

  eligibilite:
    name: La pull request est-elle éligible ?
    needs: interrupteur
    if: >-
      needs.interrupteur.outputs.armee == 'true'
      && github.event.pull_request.draft == false
      && contains(github.event.pull_request.labels.*.name, 'agent-auto-merge')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      eligible: ${{ steps.controle.outputs.eligible }}
    steps:
      # `ref` explicite : on récupère la BASE, pas la tête de la pull request.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Comparer le diff aux listes de la base
        id: controle
        continue-on-error: true
        run: |
          git fetch --no-tags origin \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}"
          node .github/scripts/verifier-eligibilite-autofix.mjs \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}" | tee eligibilite.txt

      - name: Publier le verdict
        if: always()
        run: |
          {
            echo "### Verdict d'éligibilité"
            echo
            echo '```'
            cat eligibilite.txt 2>/dev/null || echo "(le contrôle n'a produit aucune sortie)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  demander_la_fusion:
    name: Demander l'auto-fusion native
    needs: eligibilite
    if: needs.eligibilite.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Activer l'auto-fusion de GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # `--squash` : l'historique de `main` ne doit pas se remplir de
          # commits d'agent. Et `--auto` attend les contrôles requis : si la
          # protection de branche n'exige rien, RIEN n'est attendu. C'est là
          # que se joue la sécurité de ce workflow, pas ici.
          gh pr merge "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" --squash --auto
          {
            echo "Auto-fusion demandée pour la PR #${{ github.event.pull_request.number }}."
            echo
            echo "Elle n'aboutira que lorsque les contrôles **requis par la protection**"
            echo "de branche seront verts. Si la branche n'est pas protégée, la fusion"
            echo "est immédiate — vérifiez ce point avant d'armer l'interrupteur."
          } >> "$GITHUB_STEP_SUMMARY"
