<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<link rel="icon" href="../assets/logo-pjs-mark.png">
<script>
(function () {
  'use strict';
  // Preserve old 6-space bookmarks without rendering a second navigation.
  var routes={
    E0:'../moto/index.html',
    E1:'field-buying.html#farmers',
    E2:'field-buying.html#sustainability',
    E3:'field-buying.html#purchases',
    E4:'procurement.html#evacuations',
    E5:'field-buying.html#overview'
  };
  var match=/^#(E[0-5])(?:$|[-/])/.exec(location.hash);
  var target=routes[match?match[1]:'E0'];
  location.replace(target);
})();
</script>
