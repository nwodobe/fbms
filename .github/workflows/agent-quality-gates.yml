# ============================================================================
# Agent Quality Gates — contrôles qualité du site statique FBMS.
# N'utilise QUE des commandes réellement applicables (pas de build : le site
# n'en a pas). Périmètre FBMS uniquement ; savoir-plus/ a sa propre CI.
# Moindre privilège : lecture seule.
# ============================================================================
name: Agent Quality Gates

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'savoir-plus/**'
  push:
    branches:
      - 'agent/**'
    paths-ignore:
      - 'savoir-plus/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Contrôles qualité FBMS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # --- 1a. Syntaxe JS des fichiers MODIFIÉS (BLOQUANT) ----------------
      #     On contrôle le diff de la PR/branche (pratique CI standard) : un
      #     défaut préexistant hors périmètre ne doit pas bloquer une PR propre,
      #     mais tout JS introduit/modifié DOIT être syntaxiquement valide.
      - name: Syntaxe JS des fichiers modifiés (bloquant)
        run: |
          set -e
          BR="${{ github.base_ref || 'main' }}"
          git fetch --no-tags --depth=50 origin "$BR" 2>/dev/null || true
          BASE=$(git rev-parse "origin/$BR" 2>/dev/null || echo "")
          if [ -z "$BASE" ]; then echo "Base introuvable, contrôle du diff ignoré."; exit 0; fi
          CHANGED=$(git diff --name-only --diff-filter=d "$BASE"...HEAD -- '*.js' '*.mjs' | grep -v '^savoir-plus/' || true)
          if [ -z "$CHANGED" ]; then echo "Aucun fichier JS/MJS FBMS modifié dans ce diff."; exit 0; fi
          echo "$CHANGED" | while read -r f; do [ -f "$f" ] || continue; echo "check $f"; node --check "$f"; done
          echo "OK : syntaxe valide pour tous les fichiers JS/MJS modifiés."

      # --- 1b. Scan syntaxe du dépôt entier (RAPPORT, non bloquant) -------
      #     Rend visible la dette préexistante sans bloquer la PR. Ne masque rien.
      - name: Syntaxe JS du dépôt entier (rapport)
        continue-on-error: true
        run: |
          FAIL=0
          for f in $(git ls-files '*.js' '*.mjs' | grep -v '^savoir-plus/'); do
            if ! node --check "$f" 2>/tmp/nc_err; then
              echo "::warning file=$f::Syntaxe JS invalide (dette préexistante) — $(head -1 /tmp/nc_err)"
              FAIL=$((FAIL+1))
            fi
          done
          echo "Fichiers en échec de syntaxe (préexistants, non bloquants) : $FAIL"

      # --- 2. Installer Chromium pour les contrôles runtime --------------
      - name: Installer Playwright (Chromium)
        run: |
          npm init -y >/dev/null 2>&1
          npm i --no-save playwright@1.48.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium

      # --- 3. Servir le site localement ----------------------------------
      - name: Servir le site
        run: |
          npx --yes http-server -p 8080 -c-1 . >/tmp/http.log 2>&1 &
          for i in $(seq 1 15); do
            curl -sf http://localhost:8080/index.html >/dev/null && break || sleep 1
          done
          curl -sf http://localhost:8080/index.html >/dev/null

      # --- 4. Liens internes (bloquant) ----------------------------------
      - name: Vérifier les liens internes
        run: node .github/agent-scripts/link-check.mjs http://localhost:8080/index.html

      # --- 5. Erreurs JS console + a11y de base (bloquant sur exception) --
      - name: Contrôles runtime (3 viewports)
        run: node .github/agent-scripts/checks.mjs http://localhost:8080/index.html

      # --- 6. Validation HTML (signalée, non bloquante) ------------------
      - name: Validation HTML (rapport)
        continue-on-error: true
        run: |
          FILES=$(git ls-files '*.html' | grep -v '^savoir-plus/' || true)
          [ -z "$FILES" ] && { echo "Aucun HTML FBMS."; exit 0; }
          npx --yes html-validate $FILES || echo "::warning::Rapport html-validate ci-dessus (non bloquant)."

      # --- 7. Audit dépendances : seulement s'il existe un manifeste ------
      #     Le site FBMS (racine) n'a pas de package.json : rien à auditer.
      - name: Audit des dépendances (si applicable)
        run: |
          if [ -f package-lock.json ]; then
            npm audit --audit-level=high
          else
            echo "Pas de gestionnaire de paquets à la racine FBMS : audit non applicable."
          fi
