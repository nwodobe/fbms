name: Rich enrollment one-shot fix

on:
  push:
    branches: [feat/field-buying-rich-enrollment]
    paths:
      - '.github/workflows/rich-enrollment-self-fix.yml'
      - 'operations/field-buying-rich-enrollment.js'

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[rich-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/field-buying-rich-enrollment
      - name: Keep empty numeric values null
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('operations/field-buying-rich-enrollment.js')
          s = p.read_text()
          old = "function n(v) { var x = Number(v); return isFinite(x) ? x : null; }"
          new = "function n(v) { if (v == null || String(v).trim() === '') return null; var x = Number(v); return isFinite(x) ? x : null; }"
          if old not in s:
              raise SystemExit('target numeric helper not found')
          p.write_text(s.replace(old, new, 1))
          PY
          node --check operations/field-buying-rich-enrollment.js
      - name: Commit correction
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add operations/field-buying-rich-enrollment.js
          git commit -m "fix(field-buying): preserve null for empty numeric fields [rich-fix]"
          git push origin HEAD:feat/field-buying-rich-enrollment
