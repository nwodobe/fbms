name: Operations Suite PR

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'operations/**'
      - 'supabase/**'
      - 'tests/operations-suite-static.mjs'
      - 'tests/field-buying-profiles-static.mjs'
      - 'tests/field-buying-prefilled-edit-static.mjs'
      - 'tests/field-buying-performance-static.mjs'
      - 'tests/sacherie-operational-p1-static.mjs'
      - 'tests/sacherie-aflp-colonnes-droits-static.mjs'
      - 'tests/sacherie-tolerance-pannes.mjs'
      # Le workflow se surveille lui-même : sans cette entrée, une pull request
      # qui ne toucherait QUE ce fichier ne déclencherait pas le job, et une
      # régression introduite ici passerait sans aucun contrôle.
      - '.github/workflows/operations-suite-pr.yml'

permissions:
  contents: read

jobs:
  operations-static:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assertions architecture métier
        run: node tests/operations-suite-static.mjs
      - name: Assertions fiches 360 et médias FIELD BUYING
        run: node tests/field-buying-profiles-static.mjs
      - name: Assertions édition préremplie FIELD BUYING
        run: node tests/field-buying-prefilled-edit-static.mjs
      - name: Assertions performance FIELD BUYING
        run: node tests/field-buying-performance-static.mjs
      - name: Assertions Sacherie opérationnelle P1
        run: node tests/sacherie-operational-p1-static.mjs
      # Incident du 30/08/2026 : colonne inexistante lue sur ops_bag_releases,
      # et droits manquants sur les vues sacherie_ct_*. Cette assertion garde
      # les deux, plus la structure qui isole les requêtes les unes des autres.
      - name: Assertions Sacherie AFLP — colonnes, droits et tolérance
        run: node tests/sacherie-aflp-colonnes-droits-static.mjs
      - name: Syntaxe JavaScript Operations
        run: |
          node --check operations/workspace.js
          node --check operations/navigation-v2.js
          node --check operations/field-buying-performance-bootstrap.js
          node --check operations/field-buying.js
          node --check operations/sacherie-operational-p1.js
          node --check operations/field-buying-profiles.js
          node --check operations/field-buying-prefilled-edit.js
          node --check operations/field-buying-v2.js
          node --check operations/lba-purchase-v2.js
          node --check operations/module-router-v2.js
          node --check operations/reports-export.js
          node --check operations/traceability-search.js

  # Ce test OUVRE la page dans Chromium avec une doublure Supabase où une requête
  # sur dix échoue, et vérifie que la rubrique Sacherie rend quand même ET que
  # l'écran nomme le jeu de données manquant. Les assertions statiques ci-dessus
  # gardent la STRUCTURE du garde-fou ; seul ce test prouve son COMPORTEMENT.
  #
  # Sa place naturelle serait le job `pages` d'agent-quality-gates.yml, qui
  # dispose déjà d'un navigateur via l'image officielle épinglée. Il vit ici
  # faute de pouvoir écrire dans ce fichier ; le coût assumé est une seconde
  # installation de Playwright, et donc une dépendance réseau que le job `pages`
  # évite justement. À déplacer si l'occasion se présente.
  #
  # Job séparé et non pas étape du job ci-dessus : `operations-static` est une
  # porte de retour rapide (5 minutes) et l'installation du navigateur la ferait
  # expirer.
  sacherie-tolerance:
    name: Tolérance aux pannes de la Sacherie AFLP
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Version épinglée, identique à celle du job `pages` : deux versions de
      # Playwright dans le même dépôt finiraient par diverger en silence.
      - name: Installer Playwright et Chromium (éphémère, version épinglée)
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save --no-audit --no-fund playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: Une requête en panne ne vide plus la rubrique
        run: node tests/sacherie-tolerance-pannes.mjs
