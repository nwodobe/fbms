# =============================================================================
# FBMS — portes qualité des agents
# =============================================================================
# N'exécute QUE des contrôles qui existent réellement sur ce dépôt. FBMS est un
# site statique : il n'y a ni build, ni gestionnaire de paquets à la racine.
#
# `savoir-plus/` est exclu : cette application Next.js a sa propre CI.
name: Agent Quality Gates

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'savoir-plus/**'
  push:
    branches:
      - 'agent/**'
      - 'audit/**'
    paths-ignore:
      - 'savoir-plus/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  statique:
    name: Structure, liens, syntaxe et règles métier
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Structure des pages HTML
        run: node .github/scripts/verifier-html.mjs

      - name: Liens internes et ressources
        run: node .github/scripts/verifier-liens.mjs

      - name: Syntaxe JavaScript
        run: node .github/scripts/verifier-js.mjs

      - name: Farmer Registry complet
        run: node tests/farmer-registry-complete.mjs

      - name: Cohérence de la politique de chemins
        run: node .github/agent-tests/politique-chemins.mjs

  pages:
    name: Exécution des pages, console et accessibilité
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installer Playwright (éphémère, version épinglée)
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save --no-audit --no-fund playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: Pages, erreurs console et accessibilité
        run: node .github/scripts/verifier-pages.mjs --json observations-pages.json

      - name: Conserver les observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observations-pages
          path: observations-pages.json
          if-no-files-found: ignore

  eligibilite:
    name: Éligibilité à la correction automatique
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Comparer le diff aux listes de la branche de base
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          node .github/scripts/verifier-eligibilite-autofix.mjs \
            "origin/${{ github.base_ref }}" "${{ github.event.pull_request.head.sha }}"
