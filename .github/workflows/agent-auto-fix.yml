# =============================================================================
# FBMS — correction automatique encadrée
# =============================================================================
# Ce workflow ne corrige rien tout seul : il prépare une branche et une PULL
# REQUEST BROUILLON qu'un humain relit. C'est délibéré. FBMS mélange, dans les
# mêmes fichiers HTML, la présentation et la logique métier ; une correction
# « cosmétique » appliquée sans lecture peut déplacer un comportement.
#
# Le périmètre autorisé est défini par `.github/agent-policy/auto-merge-*.txt`
# et vérifié par `verifier-eligibilite-autofix.mjs`, qui lit ces listes depuis
# la BRANCHE DE BASE — jamais depuis la branche produite ici. Une correction
# automatique qui pourrait élargir sa propre autorisation n'en serait plus une.
#
# Ce que ce workflow ne fera jamais, quelle que soit la demande :
#   · toucher à `shared/auth-gate.js`, `shared/admin.html`, `supabase/**` ;
#   · toucher à `.github/**` ou `.claude/**` (il se réécrirait lui-même) ;
#   · pousser sur `main` ;
#   · fusionner quoi que ce soit.
name: Correction automatique des agents

on:
  workflow_dispatch:
    inputs:
      issue:
        description: "Numéro de l'issue d'audit à traiter (facultatif)"
        type: string
        required: false
      motif:
        description: "Ce qui doit être corrigé, en une phrase"
        type: string
        required: true
  issues:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: auto-fix-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  conditions:
    name: Conditions d'exécution
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      autorise: ${{ steps.verdict.outputs.autorise }}
    steps:
      - name: Vérifier l'activation et le déclencheur
        id: verdict
        env:
          AI_AGENTS_ENABLED: ${{ vars.AI_AGENTS_ENABLED }}
          AGENT_AUTO_FIX_ENABLED: ${{ vars.AGENT_AUTO_FIX_ENABLED }}
          LIBELLE: ${{ github.event.label.name }}
        run: |
          if [ "${AI_AGENTS_ENABLED}" != "true" ]; then
            echo "AI_AGENTS_ENABLED n'est pas à 'true' : aucune correction tentée." >> "$GITHUB_STEP_SUMMARY"
            echo "autorise=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "${AGENT_AUTO_FIX_ENABLED}" != "true" ]; then
            echo "AGENT_AUTO_FIX_ENABLED n'est pas à 'true' : correction automatique désactivée." >> "$GITHUB_STEP_SUMMARY"
            echo "autorise=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Sur `issues: labeled`, seul le libellé dédié déclenche : sans ce
          # filtre, n'importe quel étiquetage lancerait une correction.
          if [ "${{ github.event_name }}" = "issues" ] && [ "${LIBELLE}" != "agent-autofix" ]; then
            echo "Libellé « ${LIBELLE} » : hors périmètre, rien à faire." >> "$GITHUB_STEP_SUMMARY"
            echo "autorise=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "autorise=true" >> "$GITHUB_OUTPUT"

  correction:
    name: Préparer une correction en brouillon
    needs: conditions
    if: needs.conditions.outputs.autorise == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write        # créer la branche de correction
      pull-requests: write   # ouvrir le brouillon
      issues: write          # répondre dans l'issue d'origine
    # Le contexte `secrets` n'est pas disponible dans un `if:` de job. On expose
    # donc UNIQUEMENT un booléen de présence — jamais la valeur — et c'est lui
    # qu'on teste ensuite.
    env:
      APP_CONFIGUREE: ${{ secrets.APP_ID != '' && secrets.APP_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inventaire des secrets (présence seule)
        run: |
          {
            echo "### Secrets"
            echo
            echo "| Secret | Présent |"
            echo "| --- | --- |"
            echo "| APP_ID | ${{ secrets.APP_ID != '' && 'oui' || 'non' }} |"
            echo "| APP_PRIVATE_KEY | ${{ secrets.APP_PRIVATE_KEY != '' && 'oui' || 'non' }} |"
            echo "| ANTHROPIC_API_KEY | ${{ secrets.ANTHROPIC_API_KEY != '' && 'oui' || 'non' }} |"
            echo
            echo "Seule la PRÉSENCE est relevée. Aucune valeur n'est lue ni affichée."
          } >> "$GITHUB_STEP_SUMMARY"

      # Un jeton d'App GitHub est plus finement limité que `GITHUB_TOKEN` et
      # porte une identité propre dans l'historique. Il est utilisé s'il est
      # configuré ; sinon on retombe sur `GITHUB_TOKEN`, dont les droits sont
      # déjà restreints au job ci-dessus.
      - name: Jeton d'App GitHub (si configuré)
        id: app
        if: env.APP_CONFIGUREE == 'true'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Rappeler le périmètre autorisé
        run: |
          {
            echo "### Périmètre de correction automatique"
            echo
            echo "Autorisé (allowlist) :"
            sed 's/^/    /' .github/agent-policy/auto-merge-allowlist.txt
            echo
            echo "Interdit (denylist) — prioritaire sur l'allowlist :"
            sed 's/^/    /' .github/agent-policy/auto-merge-denylist.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Créer la branche de correction
        id: branche
        env:
          MOTIF: ${{ inputs.motif || format('issue #{0}', github.event.issue.number) }}
        run: |
          set -euo pipefail
          NOM="agent/auto-fix-${{ github.run_id }}"
          git config user.name  "fbms-agents[bot]"
          git config user.email "fbms-agents[bot]@users.noreply.github.com"
          git checkout -b "$NOM"
          echo "nom=$NOM" >> "$GITHUB_OUTPUT"
          echo "Branche $NOM créée pour : $MOTIF" >> "$GITHUB_STEP_SUMMARY"

      # ---------------------------------------------------------------------
      # Ce workflow met en place la mécanique ; il ne rédige pas de correctif
      # par lui-même. Le correctif provient de `auto-fix-agent`, exécuté par
      # Claude Code — c'est-à-dire d'un humain qui lance l'agent, ou d'une
      # intégration que vous ajouterez ici quand vous l'aurez décidée.
      #
      # Écrire à cet endroit une étape qui prétendrait « appliquer une
      # correction » sans rien appliquer donnerait une exécution verte et un
      # sentiment de sécurité sans objet. L'étape ci-dessous constate donc
      # honnêtement l'état du dépôt et s'arrête s'il n'y a rien à proposer.
      # ---------------------------------------------------------------------
      - name: Y a-t-il une correction à proposer ?
        id: diff
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo "modifie=false" >> "$GITHUB_OUTPUT"
            {
              echo "Aucune modification dans l'arbre de travail : rien à proposer."
              echo
              echo "C'est le comportement attendu quand ce workflow est déclenché seul."
              echo "Le correctif est produit par l'agent \`auto-fix-agent\`"
              echo "(voir \`.claude/agents/auto-fix-agent.md\` et \`docs/AI_AGENT_OPERATIONS.md\`)."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "modifie=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Vérifier l'éligibilité avant de proposer quoi que ce soit
        if: steps.diff.outputs.modifie == 'true'
        run: |
          set -euo pipefail
          git add -A
          git commit -m "correction automatique encadrée : ${{ inputs.motif || github.event.issue.title }}"
          node .github/scripts/verifier-eligibilite-autofix.mjs "origin/${{ github.event.repository.default_branch }}" HEAD

      - name: Rejouer les portes qualité statiques
        if: steps.diff.outputs.modifie == 'true'
        run: |
          node .github/scripts/verifier-html.mjs
          node .github/scripts/verifier-liens.mjs
          node .github/scripts/verifier-js.mjs

      - name: Pousser et ouvrir un brouillon
        if: steps.diff.outputs.modifie == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git push -u origin "${{ steps.branche.outputs.nom }}"
          gh pr create --draft \
            --base "${{ github.event.repository.default_branch }}" \
            --head "${{ steps.branche.outputs.nom }}" \
            --title "[AGENT][HUMAN-REVIEW] ${{ inputs.motif || github.event.issue.title }}" \
            --body "$(printf '%s\n' \
              'Correction préparée automatiquement, **à relire par un humain**.' \
              '' \
              'Éligibilité vérifiée contre les listes de la branche de base, et portes' \
              'qualité statiques rejouées — voir les journaux de cette exécution.' \
              '' \
              'Ce brouillon ne se fusionne pas tout seul.')"
